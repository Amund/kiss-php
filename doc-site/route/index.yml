path: /index.html
template: page.twig
data:
  title: Home
  sections:
    - title: What is Kiss?
      content: |
        Kiss is a PHP static site generator. It uses **Twig** for templating,
        supports YAML/JSON/PHP/XML/INI data sources, dynamic page parameters,
        static file sync, and a *watch* mode with partial rebuilds.
      image: img/image.png

    - title: Quick start
      content: |
        ```sh
        composer global require amund/kiss-php
        kiss init my-site
        cd my-site
        kiss build
        ```

    - title: Features
      content: |
        - **`items`** - dedicated property for child pages
        - **`path()`** - URL generation between routes
        - **`route()`** - cross-route data access
        - **`asset()`** - signed URLs (cache busting)
        - **`paginate`** - automatic pagination
        - **Partial rebuilds** - only impacted routes on file change

    - title: Workflow
      content: |
        ```mermaid
        graph TD
            A[kiss.yml] --> B[Config]
            B --> C[Build]
            C --> D[copy dir]
            D --> I[Static files]
            C --> E[route dir]
            E --> F[items + data]
            F --> G[Twig render]
            G --> H[HTML pages]
            H --> J[Route manifest]
            J --> K[Clean stale files]
        ```

    - title: License
      content: MIT
