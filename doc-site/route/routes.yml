path: /routes.html
template: page.twig
data:
  title: Routes
  sections:
    - title: Overview
      content: |
        A route is a page definition. Each file in `route/` describes one route,
        its URL path, its Twig template, and the data it needs to render.

        ### Fields

        | Field | Required | Description |
        |---|---|---|
        | `path` | ✓ | URL pattern, e.g. `/about.html` or `/{slug}.html` |
        | `template` | ✓ | Twig template to render |
        | `data` | | Metadata or archive context, merged into child pages |
        | `items` | | Array of child items — one page per item when path has `{param}` |
        | `paginate` | | Items per page for pagination |

        ### Supported formats

        | Format | Extension | Nested data | `$ref` |
        |---|---|---|---|
        | YAML | `.yml` / `.yaml` | ✓ | ✓ |
        | JSON | `.json` | ✓ | ✓ |
        | PHP | `.php` | ✓ | ✓ |

        > XML and INI are not supported for routes because they cannot represent
        > nested arrays or the `$ref` syntax required by routes.

    - title: Single page
      tabs:
        - label: YAML
          language: yaml
          code: |
            path: /index.html
            template: page.twig
            data:
              title: Home
        - label: JSON
          language: json
          code: |
            {
              "path": "/index.html",
              "template": "page.twig",
              "data": {
                "title": "Home"
              }
            }
        - label: PHP
          language: php
          code: |
            <?php
            return [
              'path' => '/index.html',
              'template' => 'page.twig',
              'data' => ['title' => 'Home'],
            ];

    - title: Pages with parameters
      content: |
        The `items` key allows you to generate one or multiple pages.
        Each item in this list generates a separate page.
        The `data` key contains metadata, merged into every child page.

      tabs:
        - label: YAML
          language: yaml
          code: |
            path: /{slug}.html
            template: post.twig
            data:
              blog_title: "My Blog"
            items:
              - slug: hello-world
                title: Hello World
              - slug: second-article
                title: Second article
        - label: JSON
          language: json
          code: |
            {
              "path": "/{slug}.html",
              "template": "post.twig",
              "data": {
                "blog_title": "My Blog"
              },
              "items": [
                {
                  "slug": "hello-world",
                  "title": "Hello World"
                },
                {
                  "slug": "second-article",
                  "title": "Second article"
                }
              ]
            }
        - label: PHP
          language: php
          code: |
            <?php
            return [
              'path' => '/{slug}.html',
              'template' => 'post.twig',
              'data' => ['blog_title' => 'My Blog'],
              'items' => [
                ['slug' => 'hello-world', 'title' => 'Hello World'],
                ['slug' => 'second-article', 'title' => 'Second article'],
              ],
            ];
    - title: External reference ($ref)
      content: |
        You can reference an external file using the `$ref` keyword.
        External references can be local files (e.g., `data/articles.yml`)
        or remote files (e.g., `https://example.com/data/articles.yml`).

      tabs:
        - label: YAML
          language: yaml
          code: |
            path: /{slug}.html
            template: post.twig
            items:
              $ref: data/articles.yml
        - label: JSON
          language: json
          code: |
            {
              "path": "/{slug}.html",
              "template": "post.twig",
              "items": {
                "$ref": "data/articles.yml"
              }
            }
        - label: PHP
          language: php
          code: |
            <?php
            return [
              'path' => '/{slug}.html',
              'template' => 'post.twig',
              'items' => ['$ref' => 'data/articles.yml'],
            ];

    - title: Archive page with list
      content: |
        ```yaml
        path: /blog
        template: blog_list.twig
        data:
          title: "Blog"
        items:
          $ref: data/posts.yml
        ```

        Template :

        ```twig
        <h1>{{ title }}</h1>
        {% for post in items %}
          <a href="{{ path('blog', {slug: post.slug}) }}">{{ post.title }}</a>
        {% endfor %}
        ```

    - title: Pagination
      content: |
        ```yaml
        path: /blog
        template: blog_list.twig
        paginate: 10
        data:
          title: Archives
        items:
          $ref: data/posts.yml
        ```

        Generates `blog/index.html` (page 1) and `blog/page/{n}/index.html`.

        ```twig
        {% for post in items %}
          ...
        {% endfor %}
        {% if prevPage %}
          <a href="{{ path('blog', {page: prevPage}) }}">← Previous</a>
        {% endif %}
        {% if nextPage %}
          <a href="{{ path('blog', {page: nextPage}) }}">Next →</a>
        {% endif %}
        ```
