path: /reference.html
template: page.twig
data:
  title: Reference
  sections:
    - title: Twig functions
      content: |
        ### `path(name, params)`

        Generates URLs between routes :

        ```twig
        {{ path('about') }}                          → /about
        {{ path('blog', {slug: 'hello'}) }}          → /hello.html
        {{ path('blog') }}                            → /blog
        {{ path('blog', {page: 2}) }}                 → /blog/page/2
        ```

        Trailing `/index.html` is automatically cleaned :

        ```twig
        {{ path('index') }}                           → /
        {{ path('blog') }}                            → /blog
        ```

        ### `route(name)`

        Access another route's resolved data :

        ```twig
        {% set blog = route('blog') %}
        <h1>{{ blog.title }}</h1>
        {% for post in blog.items %}
          <a href="{{ path('blog', {slug: post.slug}) }}">{{ post.title }}</a>
        {% endfor %}
        ```

        ### `asset(path)`

        Signed URLs with CRC32C hash for cache busting :

        ```twig
        <link rel="stylesheet" href="{{ asset('css/style.css') }}">
        <!-- → /css/style.css?v=70a5a1d3 -->
        ```

        ### `dump(...)`

        VarDump helper (only in debug mode) :

        ```twig
        {{ dump() }}
        {{ dump(foo, bar) }}
        ```

    - title: Twig filters
      content: |
        ### `markdown`

        Converts Markdown to HTML via league/commonmark (GFM) :

        ```twig
        {{ content|markdown|raw }}
        ```

        ### `slugify`

        Converts a string into a URL-safe slug :

        ```twig
        {{ 'Hello World'|slugify }}    → hello-world
        {{ section.title|slugify }}     → ma-section
        ```

    - title: Data sources
      content: |
        Files in `data/` are loaded automatically and accessible via `{{ global.* }}`.

        Supported formats : YAML, JSON, PHP, XML, INI, Markdown.

        `data/site.yml` :

      tabs:
        - label: YAML
          language: yaml
          code: |
            name: My Site
            tagline: Great static site
        - label: JSON
          language: json
          code: |
            {
              "name": "My Site",
              "tagline": "Great static site"
            }
        - label: PHP
          language: php
          code: |
            <?php
            return [
              'name' => 'My Site',
              'tagline' => 'Great static site',
            ];
        - label: XML
          language: xml
          code: |
            <?xml version="1.0"?>
            <root>
              <name>My Site</name>
              <tagline>Great static site</tagline>
            </root>
        - label: INI
          language: ini
          code: |
            name = My Site
            tagline = Great static site
    - title: Caching
      content: |
        Every data source is transformed into a PHP file and cached in
        `/tmp/kiss/<hash>/datatree/`.

        **How it works :**

        1. A `.yml`, `.json`, `.xml`, `.ini`, `.md` or `.php` file is loaded
        2. The appropriate loader parses it (YamlLoader, JsonLoader, etc.)
        3. The result is serialized as a PHP file via `var_export()` and stored
        4. On subsequent builds, the cached PHP is included — no parsing needed
        5. When the source file changes, the cache is invalidated

        **Same mechanism for `$ref` and remote files :**

        ```yaml
        items:
          $ref: https://api.example.com/posts.json
        ```

        URLs are fetched once, cached as PHP, and served from cache on rebuilds
        until the resource changes.

        **Cache invalidation :**

        - `kiss reset cache` removes all cached files
        - `DataTree::invalidate(source)` removes a single entry
        - Automatic when the source file's CRC32C changes

    - title: Markdown
      content: |
        ```markdown
        ---
        title: My Article
        date: 2024-01-01
        ---
        Content **markdown** here.
        ```

        Frontmatter fields are available directly, body as `content` :

        ```twig
        <h1>{{ title }}</h1>
        <div>{{ content|markdown|raw }}</div>
        ```

    - title: CLI commands
      content: |
        | Command | Description |
        |---|---|
        | `kiss init [dir]` | Create a new site |
        | `kiss build` | Build the whole site |
        | `kiss watch` | Build then watch for changes |
        | `kiss route [list\|name]` | List or rebuild routes |
        | `kiss copy [path]` | Sync a file from `copy/` to `web/` |
        | `kiss reset [all\|dist\|cache]` | Remove `web/` and/or `tmp/` |
        | `kiss test` | Validate configuration |
