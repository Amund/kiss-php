path: /docs.html
template: page.twig
data:
  title: Documentation
  sections:
    - title: Installation
      content: |
        Via Composer (global) :

        ```sh
        composer global require amund/kiss-php
        kiss init my-site
        cd my-site
        kiss build
        ```

        Via PHAR (no Composer needed) :

        ```sh
        curl -LO https://github.com/amund/kiss-php/releases/latest/download/kiss.phar
        chmod +x kiss.phar
        ./kiss.phar init my-site
        cd my-site
        ./kiss.phar build
        ```

        To be able to just type `kiss`, move it somewhere in your path, for example :

        ```sh
        curl -LO https://github.com/amund/kiss-php/releases/latest/download/kiss.phar
        chmod +x kiss.phar
        mv kiss.phar ~/.local/bin/kiss
        kiss init my-site
        cd my-site
        kiss build
        ```

    - title: Default project structure
      content: |
        ```
        kiss.yml        → Site configuration
        ├── copy/       → Static files (copied as-is to web/)
        ├── data/       → Global data (YAML/JSON/PHP/XML/INI/MD)
        ├── route/      → Route definitions (YAML/JSON/PHP)
        ├── template/   → Twig templates
        └── web/        → Generated site (dist)
        ```

        These directories are the default ones, but they can be changed in the configuration file.

    - title: Configuration file
      content: |
        Supported formats : YAML, JSON, PHP, XML, INI.

        `cache: system` - `system` is not actually a directory; the value `system` is replaced with a unique directory within the system directory (e.g., `/tmp/kiss/[project-hash]/`). Any other value will be treated as a directory.

      tabs:
        - label: YAML
          language: yaml
          code: |
            debug: true
            path:
              copy: copy
              data: data
              route: route
              template: template
              dist: web
              cache: system
        - label: JSON
          language: json
          code: |
            {
              "debug": true,
              "path": {
                "copy": "copy",
                "data": "data",
                "route": "route",
                "template": "template",
                "dist": "web",
                "cache": "system"
              }
            }
        - label: PHP
          language: php
          code: |
            <?php
            return [
              'debug' => true,
              'path' => [
                'copy' => 'copy',
                'data' => 'data',
                'route' => 'route',
                'template' => 'template',
                'dist' => 'web',
                'cache' => 'system',
              ],
            ];
        - label: XML
          language: xml
          code: |
            <?xml version="1.0"?>
            <root>
              <debug>true</debug>
              <path>
                <copy>copy</copy>
                <data>data</data>
                <route>route</route>
                <template>template</template>
                <dist>web</dist>
                <cache>system</cache>
              </path>
            </root>
        - label: INI
          language: ini
          code: |
            debug = true
            [path]
            copy = copy
            data = data
            route = route
            template = template
            dist = web
            cache = system
    - title: Environment variables
      content: |
        - `KISS_DEBUG=true` - Set Twig to debug mode, enabling the use of `dump()`
        - `KISS_VERBOSE=true` - Add debug information to the console
        - `KISS_ENTRY=path/to/config.yml` - you can launch Kiss from anywhere, base folder is the folder containing the config file
        - `KISS_BASE_URL=""` - used internally to deploy on a subfolder
