path: /docs.html
template: page.twig
data:
  title: Documentation
  sections:
    - title: Installation
      content: |
        Via Composer (global) :

        ```sh
        composer global require amund/kiss-php
        kiss init my-site
        cd my-site
        kiss build
        ```

        Via PHAR (no Composer needed) :

        ```sh
        curl -LO https://github.com/amund/kiss-php/releases/latest/download/kiss.phar
        chmod +x kiss.phar
        ./kiss.phar init my-site
        cd my-site
        ./kiss.phar build
        ```

    - title: Project structure
      content: |
        ```mermaid
        graph LR
            site[/project/]
            site --> config(kiss.yml)
            site --> sources[Sources]
            sources --> copy[copy/]
            sources --> data[data/]
            sources --> route[route/]
            sources --> template[template/]
            site --> output[Output]
            output --> web[web/]

            style site fill:#27272a,stroke:#52525b,color:#e4e4e7
            style config fill:#16a34a,stroke:#15803d,color:#fff
            style sources fill:transparent,stroke-dasharray:4 2,stroke:#52525b,color:#a1a1aa
            style output fill:transparent,stroke-dasharray:4 2,stroke:#52525b,color:#a1a1aa
            style copy fill:#3f3f46,stroke:#52525b,color:#e4e4e7
            style data fill:#3f3f46,stroke:#52525b,color:#e4e4e7
            style route fill:#3f3f46,stroke:#52525b,color:#e4e4e7
            style template fill:#3f3f46,stroke:#52525b,color:#e4e4e7
            style web fill:#3f3f46,stroke:#52525b,color:#e4e4e7
        ```

    - title: Configuration file
      content: |
        Supported formats : YAML, JSON, PHP, XML, INI.

      tabs:
        - label: YAML
          language: yaml
          code: |
            debug: true
            path:
              copy: copy
              data: data
              route: route
              template: template
              dist: web
              cache: tmp
        - label: JSON
          language: json
          code: |
            {
              "debug": true,
              "path": {
                "copy": "copy",
                "data": "data",
                "route": "route",
                "template": "template",
                "dist": "web",
                "cache": "tmp"
              }
            }
        - label: PHP
          language: php
          code: |
            <?php
            return [
              'debug' => true,
              'path' => [
                'copy' => 'copy',
                'data' => 'data',
                'route' => 'route',
                'template' => 'template',
                'dist' => 'web',
                'cache' => 'tmp',
              ],
            ];
        - label: XML
          language: xml
          code: |
            <?xml version="1.0"?>
            <root>
              <debug>true</debug>
              <path>
                <copy>copy</copy>
                <data>data</data>
                <route>route</route>
                <template>template</template>
                <dist>web</dist>
                <cache>tmp</cache>
              </path>
            </root>
        - label: INI
          language: ini
          code: |
            debug = true
            [path]
            copy = copy
            data = data
            route = route
            template = template
            dist = web
            cache = tmp
    - title: Environment
      content: |
        Environment overrides :

        - `KISS_DEBUG=true`
        - `KISS_VERBOSE=true`
        - `KISS_ENTRY=path/to/config.yml`
