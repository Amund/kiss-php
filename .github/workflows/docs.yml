name: Docs

on:
  push:
    branches: [main]
    paths: ['doc-site/**', '.github/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer
      - run: composer install --no-dev --no-interaction --quiet
      - run: php -d phar.readonly=0 build-phar.php
      - run: cd doc-site && ../kiss.phar build
        env:
          KISS_BASE_URL: /kiss-php
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
